name: 私服架构测试
on:
  push:
    paths: ['apps/**', 'packages/**', 'src/**', 'tests/**', 'pnpm-workspace.yaml', '.github/workflows/registry-tests.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node --test packages/protocol/test.js apps/admin/test.js
