name: 离线能力包测试
on:
  push:
    paths: ['apps/**', 'packages/**', 'capabilities/**', 'tools/**', 'build.mjs', 'package.json', 'pnpm-lock.yaml', 'tests/**', 'pnpm-workspace.yaml', '.github/workflows/registry-tests.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node --test packages/protocol/test.js apps/admin/test.js tests/catalog-sync.test.js tests/runtime.test.js

      - run: npm ci
      - run: npm run typecheck
      - name: 生成 pnpm workspace 锁文件
        run: |
          npm install -g pnpm@10.18.3
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: 现行功能完整回归
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pandas==3.0.1
          export CAPABILITY_CENTER_BUILD_PYTHON="$(command -v python)"
          export CAPABILITY_CENTER_TEST_PYTHON="$CAPABILITY_CENTER_BUILD_PYTHON"
          npm test
          npm run test:packages
      - name: 验证独立构建
        run: |
          npm run pack:target -- center
          npm run pack:target -- auto-continue
          npm run pack:target -- offline-ocr
          npm run pack:target -- drawio
          npm run pack:target -- genui
          npm run pack:target -- office-enhancement
