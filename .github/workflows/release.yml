name: 打包并发布离线 ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 安装测试用 Office 库
        run: |
          python -m pip install --disable-pip-version-check \
            python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pandas==3.0.1
      - name: 构建并测试离线包
        run: |
          export CAPABILITY_CENTER_BUILD_PYTHON="$(command -v python)"
          export CAPABILITY_CENTER_TEST_PYTHON="$CAPABILITY_CENTER_BUILD_PYTHON"
          npm test
          sha256sum capability-center-offline.zip > capability-center-offline.zip.sha256
      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json 中的版本需要是 x.y.z"
            exit 1
          fi
          tag="v$version"
          existing_tag="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag")"
          if [[ -n "$existing_tag" ]]; then
            echo "::error::标签 $tag 已存在，请提升版本后再发布"
            exit 1
          fi
          gh release create "$tag" \
            capability-center-offline.zip capability-center-offline.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "能力中心 $tag" --generate-notes
