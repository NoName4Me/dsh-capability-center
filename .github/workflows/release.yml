name: 构建管理台上传包

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 安装测试用 Office 库
        run: |
          python -m pip install --disable-pip-version-check \
            python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pandas==3.0.1
      - name: 构建并测试离线包
        run: |
          export CAPABILITY_CENTER_BUILD_PYTHON="$(command -v python)"
          export CAPABILITY_CENTER_TEST_PYTHON="$CAPABILITY_CENTER_BUILD_PYTHON"
          npm ci
          npm test
          for target in center auto-continue offline-ocr drawio office-enhancement genui; do npm run pack:target -- "$target"; done
      - uses: actions/upload-artifact@v4
        with:
          name: admin-upload-packages
          path: |
            dist-independent/**/*.upload.zip
            dist-independent/center/packages/capability-center-*.tgz
          if-no-files-found: error
