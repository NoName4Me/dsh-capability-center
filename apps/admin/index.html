<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>能力发布管理</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>DSH / 发布管理</small><h1>能力目录</h1><p>上传完整离线能力 ZIP，校验后发布；无需 npm、PyPI 或 Raw 私服。</p></div><a href="/catalog.json">查看公开目录</a></header><section><h2>管理员凭据</h2><form id="login"><label>访问令牌<input id="token" type="password" autocomplete="off" required></label><button>连接</button></form></section><section><h2>上传能力包</h2><form id="upload"><label>能力 ZIP<input id="file" type="file" accept=".zip,application/zip" required></label><button>上传并校验</button></form><p>支持插件、技能、组合能力及核心更新。每个包最大 128 MiB；普通依赖随包，组合能力引用已发布的版本。上传不会自动发布。</p></section><p id="status" role="status"></p><section><h2>版本管理</h2><div id="versions"></div></section><section><h2>发布记录</h2><div id="audit"></div></section></main><script src="/app.js" type="module"></script></body></html>
