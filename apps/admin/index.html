<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>能力发布管理</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>DSH / 发布管理</small><h1>能力目录</h1><p>从内网 npm 私服导入已构建的 DSH Bundle，校验后发布。</p></div><a href="/catalog.json">查看公开目录</a></header><section><h2>管理员凭据</h2><form id="login"><label>访问令牌<input id="token" type="password" autocomplete="off" required></label><button>连接</button></form></section><section><h2>导入版本</h2><form id="import"><label>npm 包名<input id="name" placeholder="@company/dsh-plugin" required></label><label>精确版本<input id="version" placeholder="1.0.0" required></label><button>导入草稿</button></form><p>默认读取包内 capability、description 与 DSH 兼容信息。不上传或执行代码。</p><form id="import-raw"><label>Raw Skill 声明路径<input id="raw-path" placeholder="skills/example/1.0.0/capability.json" required></label><button>导入 Skill 草稿</button></form></section><p id="status" role="status"></p><section><h2>版本管理</h2><div id="versions"></div></section><section><h2>发布记录</h2><div id="audit"></div></section></main><script src="/app.js" type="module"></script></body></html>
